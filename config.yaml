    sheet: Valdeltagande_kommun
  # Incident reports, obtained from Valmyndigheten as allmän handling 2026-10-13 (file dated 2026-10-12).
  # Holds free text: never versioned, never sent to external services.
  valmyndigheten_reports:
    file: data/raw/20261012_Incidentrapporter_valen_2026.xlsx
    sha256: 4b1d2aa07388c6d3148610b0ed8a6e072c8e91c295532a3c608a059b4fe9321a
    header_row: 2
    # Valkoll's version was released 2026-09-29 and covers reports received up to this date.
    valkoll_period_end: "2026-09-28 23:59:59"
    # Rows read by Martin 2026-10-13. Criterion: the report was sent to try the reporting
    # system and describes no event in the election. Valkoll removes three but does not say which.
    test_report_rows: [134, 627, 5091, 5092]

